name: Database audit
on:
  pull_request:
    branches: [feat/safegres-pgpm-ci-base]
  push:
    branches: [feat/safegres-pgpm-ci-base]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: constructiveio/postgres-plus:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec pgpm admin-users bootstrap --yes
      - uses: constructive-io/constructive/packages/safegres@safegres-action-v1
        with:
          version: local
          report-only: true
