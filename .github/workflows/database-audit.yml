name: Database audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_audit
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: app_audit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: psql -X -v ON_ERROR_STOP=1 -f migrations/001.sql
      - uses: constructive-io/constructive/packages/safegres@608acc891de5197ad3cb4bfd0babe1050dbec24a
        with:
          version: local
          config: safegres.audit.json
          report-only: true
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
